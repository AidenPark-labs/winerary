<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f5f0eb"/>
  <!-- shadow -->
  <ellipse cx="200" cy="375" rx="55" ry="6" fill="#d0c8c0" opacity="0.5"/>
  <!-- bottle body -->
  <path d="M155 180 Q150 190 148 220 L148 350 Q148 365 165 365 L235 365 Q252 365 252 350 L252 220 Q250 190 245 180 Z" fill="#3a3a3a"/>
  <!-- bottle shoulder curve -->
  <path d="M155 180 Q155 160 170 145 L170 145 L230 145 Q245 160 245 180 Z" fill="#3a3a3a"/>
  <!-- neck -->
  <rect x="178" y="55" width="44" height="90" rx="2" fill="#3a3a3a"/>
  <!-- capsule/foil -->
  <rect x="175" y="35" width="50" height="30" rx="3" fill="#888888"/>
  <rect x="175" y="35" width="50" height="8" rx="3" fill="#999999"/>
  <rect x="175" y="60" width="50" height="5" rx="1" fill="#777777"/>
  <!-- label -->
  <rect x="160" y="220" width="80" height="100" rx="2" fill="#555555" opacity="0.5"/>
  <!-- body highlight left -->
  <path d="M155 180 Q150 190 148 220 L148 350 Q148 365 165 365 L170 365 L170 180 Z" fill="white" opacity="0.08"/>
  <!-- body highlight right -->
  <path d="M230 180 L230 365 L235 365 Q252 365 252 350 L252 220 Q250 190 245 180 Z" fill="black" opacity="0.15"/>
  <!-- neck highlight -->
  <rect x="178" y="55" width="12" height="90" fill="white" opacity="0.06"/>
</svg>
