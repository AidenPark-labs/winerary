<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f5f0eb"/>
  <!-- shadow -->
  <ellipse cx="210" cy="380" rx="50" ry="5" fill="#c0b8b0" opacity="0.6"/>
  <!-- bottle -->
  <!-- bottom flat -->
  <rect x="152" y="370" width="96" height="6" rx="2" fill="#1a0508"/>
  <!-- body -->
  <rect x="152" y="170" width="96" height="200" rx="3" fill="#2a0a10"/>
  <!-- shoulder -->
  <path d="M152 170 Q152 130 180 115 L180 115 L220 115 Q248 130 248 170 Z" fill="#2a0a10"/>
  <!-- neck -->
  <rect x="185" y="38" width="30" height="80" rx="4" fill="#2a0a10"/>
  <!-- lip/rim at top -->
  <rect x="182" y="30" width="36" height="12" rx="5" fill="#2a0a10"/>
  <!-- capsule/foil -->
  <rect x="180" y="28" width="40" height="40" rx="5" fill="#7a6a55"/>
  <rect x="180" y="28" width="40" height="10" rx="5" fill="#8a7a65"/>
  <line x1="180" y1="50" x2="220" y2="50" stroke="#6a5a45" stroke-width="1"/>
  <line x1="180" y1="56" x2="220" y2="56" stroke="#6a5a45" stroke-width="0.5"/>
  <line x1="180" y1="62" x2="220" y2="62" stroke="#6a5a45" stroke-width="0.5"/>
  <!-- label area -->
  <rect x="160" y="210" width="80" height="110" rx="1" fill="#3a1520" opacity="0.5"/>
  <rect x="170" y="230" width="60" height="4" rx="1" fill="#5a2535" opacity="0.4"/>
  <rect x="175" y="242" width="50" height="3" rx="1" fill="#5a2535" opacity="0.3"/>
  <rect x="180" y="270" width="40" height="20" rx="1" fill="#4a1a28" opacity="0.3"/>
  <!-- body left highlight -->
  <rect x="152" y="170" width="18" height="200" rx="2" fill="white" opacity="0.07"/>
  <!-- body right shadow -->
  <rect x="234" y="170" width="14" height="200" rx="2" fill="black" opacity="0.15"/>
  <!-- shoulder highlight -->
  <path d="M152 170 Q152 135 175 118 L168 118 Q152 132 152 170 Z" fill="white" opacity="0.06"/>
  <!-- neck highlight -->
